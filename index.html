<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéBattle Universe</title>
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #101c32;
        --panel: rgba(15, 23, 42, 0.82);
        --panel-soft: rgba(30, 41, 59, 0.9);
        --line: rgba(148, 163, 184, 0.2);
        --text: #e5edf9;
        --muted: #9fb0d0;
        --yellow: #facc15;
        --blue: #7dd3fc;
        --green: #4ade80;
        --red: #f87171;
        --shadow: 0 25px 60px rgba(8, 15, 28, 0.38);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, rgba(56, 189, 248, 0.22), transparent 28%), linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body { padding: 22px; }
      button, select { font: inherit; }
      button { cursor: pointer; }

      .app-shell { max-width: 1500px; margin: 0 auto; }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 4px 8px 18px;
      }

      .brand-wrap h1 { margin: 0; font-size: clamp(2.2rem, 4vw, 3.2rem); }

      .eyebrow {
        margin: 0 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--blue);
        font-size: 0.72rem;
        font-weight: 800;
      }

      .top-actions {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 14px;
      }

      .stats-bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .stat-pill {
        min-width: 102px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(8, 47, 73, 0.38);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 8px 12px;
        box-shadow: var(--shadow);
      }

      .stat-pill span {
        font-size: 0.72rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .stat-pill strong { font-size: 1.2rem; font-weight: 800; }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .primary-btn, .secondary-btn, .mini-btn {
        border-radius: 12px;
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .primary-btn {
        border: none;
        background: linear-gradient(135deg, #facc15, #f59e0b);
        color: #111827;
        padding: 11px 18px;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(245, 158, 11, 0.2);
      }

      .secondary-btn, .mini-btn {
        border: 1px solid var(--line);
        background: rgba(14, 116, 144, 0.15);
        color: var(--text);
        padding: 10px 14px;
      }

      .primary-btn:hover, .secondary-btn:hover, .mini-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .game-layout {
        display: grid;
        grid-template-columns: minmax(280px, 1.2fr) minmax(300px, 1fr) minmax(280px, 1.2fr);
        gap: 18px;
        align-items: start;
      }

      .panel, .battle-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .team-panel { padding: 14px; }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .panel-head h2 { margin: 0; font-size: 1.25rem; }

      .team-grid { display: grid; gap: 12px; }

      .team-card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 12px;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .card-badge {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        color: #11212f;
        background: linear-gradient(135deg, var(--yellow), #f59e0b);
      }

      .card-name {
        flex: 1;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .team-card select {
        width: 100%;
        background: rgba(2, 6, 23, 0.75);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 9px 10px;
        margin-top: 6px;
      }

      .team-card .config-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .team-card .label {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .battle-panel {
        padding: 18px;
        min-height: 760px;
      }

      .battle-status {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font-weight: 700;
        margin-bottom: 18px;
      }

      .battle-arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 18px;
        padding: 10px 4px 18px;
      }

      .duel-card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(8, 47, 73, 0.2));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        min-height: 240px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .duel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.14);
        border: 1px solid rgba(125, 211, 252, 0.3);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .tag.alt {
        background: rgba(248, 113, 113, 0.12);
        border-color: rgba(248, 113, 113, 0.28);
      }

      .battle-sprite {
        display: grid;
        place-items: center;
        width: 110px;
        height: 110px;
        margin: 10px auto;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.38), rgba(148,163,184,0.06));
        box-shadow: inset 0 0 25px rgba(255,255,255,0.18);
        font-size: 4rem;
        animation: floaty 2.8s ease-in-out infinite;
      }

      .player-sprite { color: var(--blue); }
      .bot-sprite { color: var(--green); }

      @keyframes floaty {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .hp-block { display: flex; flex-direction: column; gap: 8px; }
      .hp-row {
        display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted);
      }

      .hp-bar {
        width: 100%;
        height: 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.2);
        overflow: hidden;
      }

      .hp-bar span {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, var(--green), #a3e635);
        border-radius: inherit;
        transition: width 0.35s ease;
      }

      .enemy-bar span { background: linear-gradient(90deg, #f87171, #fca5a5); }

      .versus {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(250, 204, 21, 0.26), rgba(59, 130, 246, 0.2));
        border: 1px solid var(--line);
        font-weight: 900;
        color: var(--yellow);
      }

      .move-bar {
        min-height: 90px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
        margin-bottom: 16px;
      }

      .move-chip {
        flex: 1 1 160px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        text-align: left;
      }

      .move-chip strong { display: block; margin-bottom: 4px; color: var(--yellow); }

      .battle-log-wrap {
        background: rgba(15, 23, 42, 0.64);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }

      .battle-log-header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        background: rgba(15, 118, 110, 0.1);
      }

      .battle-log {
        max-height: 210px;
        overflow-y: auto;
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .log-entry {
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 9px;
        line-height: 1.4;
        color: var(--text);
      }

      .log-entry strong { color: var(--yellow); }

      @media (max-width: 1120px) {
        .game-layout { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: stretch; }
        .top-actions { justify-content: space-between; }
      }

      @media (max-width: 640px) {
        body { padding: 14px; }
        .battle-arena { grid-template-columns: 1fr; }
        .versus { margin: 0 auto; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <p class="eyebrow">Pokédex Builder</p>
          <h1>PokéBattle Universe</h1>
        </div>

        <div class="top-actions">
          <div class="stats-bar">
            <div class="stat-pill">
              <span>Pokémon</span>
              <strong>1025</strong>
            </div>
            <div class="stat-pill">
              <span>Moves</span>
              <strong>934</strong>
            </div>
            <div class="stat-pill">
              <span>Items</span>
              <strong>571</strong>
            </div>
          </div>

          <div class="action-row">
            <button id="randomize-player" class="secondary-btn">Randomize Player</button>
            <button id="randomize-bot" class="secondary-btn">Randomize Bot</button>
            <button id="battle-btn" class="primary-btn">Battle</button>
          </div>
        </div>
      </header>

      <main class="game-layout">
        <aside class="panel team-panel left-panel">
          <div class="panel-head">
            <h2>Your Team</h2>
            <button id="save-player" class="mini-btn">Save</button>
          </div>
          <div id="player-team" class="team-grid"></div>
        </aside>

        <section class="battle-panel">
          <div class="battle-status" id="battle-status">Pick your six and challenge the bot team.</div>

          <div class="battle-arena">
            <div class="duel-card player-side">
              <div class="duel-header">
                <span class="tag">Player</span>
                <strong id="player-active-name">-</strong>
              </div>

              <div class="battle-sprite player-sprite" id="player-sprite">⚡</div>

              <div class="hp-block">
                <div class="hp-row">
                  <span>HP</span>
                  <span id="player-hp-text">0 / 0</span>
                </div>
                <div class="hp-bar">
                  <span id="player-hp-bar"></span>
                </div>
              </div>
            </div>

            <div class="versus">VS</div>

            <div class="duel-card bot-side">
              <div class="duel-header">
                <span class="tag alt">Bot</span>
                <strong id="bot-active-name">-</strong>
              </div>

              <div class="battle-sprite bot-sprite" id="bot-sprite">🌿</div>

              <div class="hp-block">
                <div class="hp-row">
                  <span>HP</span>
                  <span id="bot-hp-text">0 / 0</span>
                </div>
                <div class="hp-bar enemy-bar">
                  <span id="bot-hp-bar"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="move-bar" id="move-bar"></div>

          <div class="battle-log-wrap">
            <div class="battle-log-header">Battle log</div>
            <div id="battle-log" class="battle-log"></div>
          </div>
        </section>

        <aside class="panel team-panel right-panel">
          <div class="panel-head">
            <h2>Bot Team</h2>
            <button id="load-player" class="mini-btn">Load</button>
          </div>
          <div id="bot-team" class="team-grid"></div>
        </aside>
      </main>
    </div>

      ];

      const ABILITY_NAMES = [
        'Static', 'Overgrow', 'Torrent', 'Blaze', 'Levitate', 'Pressure', 'Intimidate', 'Swift Swim', 'Flash Fire', 'Volt Absorb', 'Shed Skin', 'Battle Armor', 'Technician', 'Adaptability', 'Speed Boost', 'Moxie', 'Drought', 'Drizzle', 'Sand Veil', 'Wonder Guard', 'Compound Eyes', 'Shadow Tag', 'Defiant', 'Toxic Boost', 'Mold Breaker', 'Vital Spirit', 'Rough Skin', 'Cute Charm', 'Storm Drain', 'Motor Drive', 'Guts', 'Magnet Pull', 'Flare Boost', 'Sniper', 'Shell Armor', 'Contrary', 'Limber', 'Multiscale', 'Filter', 'Insomnia', 'Color Change', 'Solid Rock', 'Iron Fist', 'Run Away', 'Steadfast', 'Prankster', 'Arena Trap', 'No Guard', 'Big Pecks', 'Unnerve', 'Cursed Body', 'Reckless', 'Huge Power', 'Leaf Guard', 'Inner Focus', 'Skill Link', 'Healer', 'Dry Skin', 'Poison Point', 'Regen', 'Magic Guard'
      ];

      const TYPES = ['Normal', 'Fire', 'Water', 'Electric', 'Grass', 'Ice', 'Fighting', 'Poison', 'Ground', 'Flying', 'Psychic', 'Bug', 'Rock', 'Ghost', 'Dragon', 'Dark', 'Steel', 'Fairy'];
      const STAT_KEYS = ['hp', 'attack', 'defense', 'specialAttack', 'specialDefense', 'speed'];

      function generatePokemonCatalog() {
        const list = [];
        for (let i = 0; i < POKEMON_COUNT; i++) {
          const baseName = BASE_NAMES[i % BASE_NAMES.length] || `Pokémon ${i + 1}`;
          const suffix = i >= BASE_NAMES.length ? ` ${Math.floor(i / BASE_NAMES.length) + 1}` : '';
          const typeA = TYPES[i % TYPES.length];
          const typeB = TYPES[(i * 3 + 5) % TYPES.length];
          const stats = {};
          for (const key of STAT_KEYS) stats[key] = 40 + ((i * 17 + key.length * 13) % 150);
          list.push({
            id: i + 1,
            name: `${baseName}${suffix}`,
            types: [typeA, typeB],
            sprite: ['⚡', '🌿', '🔥', '💧', '🧊', '🌋', '✨', '🦊', '🐉', '🌙'][i % 10],
            stats,
            abilityId: (i * 7 + 3) % ABILITY_COUNT + 1,
            moveIds: [
              (i * 11 + 3) % MOVE_COUNT + 1,
              (i * 17 + 5) % MOVE_COUNT + 1,
              (i * 23 + 7) % MOVE_COUNT + 1,
              (i * 29 + 9) % MOVE_COUNT + 1
            ]
          });
        }
        return list;
      }

      function generateMoveCatalog() {
        const list = [];
        for (let i = 0; i < MOVE_COUNT; i++) {
          list.push({
            id: i + 1,
            name: MOVE_NAMES[i % MOVE_NAMES.length] || `Move ${i + 1}`,
            type: TYPES[i % TYPES.length],
            power: 30 + (i % 80),
            accuracy: 80 + (i % 21),
            category: ['physical', 'special', 'status'][i % 3],
            priority: i % 4 === 0 ? 1 : 0,
            pp: 10 + (i % 18)
          });
        }
        return list;
      }

      function generateItemCatalog() {
        const list = [];
        for (let i = 0; i < ITEM_COUNT; i++) {
          list.push({
            id: i + 1,
            name: ITEM_NAMES[i % ITEM_NAMES.length] || `Item ${i + 1}`,
            effect: ['Attack', 'Defense', 'Speed', 'HP', 'Focus', 'Utility'][i % 6],
            bonus: 6 + (i % 12)
          });
        }
        return list;
      }

      function generateAbilityCatalog() {
        const list = [];
        for (let i = 0; i < ABILITY_COUNT; i++) {
          list.push({
            id: i + 1,
            name: ABILITY_NAMES[i % ABILITY_NAMES.length] || `Ability ${i + 1}`,
            boost: 4 + (i % 15)
          });
        }
        return list;
      }

      const pokemonCatalog = generatePokemonCatalog();
      const moveCatalog = generateMoveCatalog();
      const itemCatalog = generateItemCatalog();
      const abilityCatalog = generateAbilityCatalog();

      const state = { playerTeam: [], botTeam: [], battleRunning: false };

      function getPokemonById(id) {
        return pokemonCatalog.find((p) => p.id === Number(id)) || pokemonCatalog[0];
      }
      function getMoveById(id) { return moveCatalog.find((m) => m.id === Number(id)) || moveCatalog[0]; }
      function getItemById(id) { return itemCatalog.find((i) => i.id === Number(id)) || itemCatalog[0]; }
      function getAbilityById(id) { return abilityCatalog.find((a) => a.id === Number(id)) || abilityCatalog[0]; }

      function getMoveIdForPokemon(pokemon, index) {
        const offset = (pokemon.id * (index + 2) * 17) % moveCatalog.length;
        return moveCatalog[offset].id;
      }

      function getRandomTeam(typeKey) {
        const team = [];
        const seen = new Set();
        while (team.length < MAX_TEAM_SIZE) {
          const randomId = Math.floor(Math.random() * pokemonCatalog.length) + 1;
          if (seen.has(randomId)) continue;
          seen.add(randomId);
          const pokemon = getPokemonById(randomId);
          team.push({
            pokemonId: pokemon.id,
            itemId: itemCatalog[(randomId * 7 + (typeKey === 'bot' ? 3 : 1)) % itemCatalog.length].id,
            abilityId: abilityCatalog[(randomId * 13 + (typeKey === 'bot' ? 5 : 2)) % abilityCatalog.length].id,
            moveIds: [
              getMoveIdForPokemon(pokemon, 1),
              getMoveIdForPokemon(pokemon, 2),
              getMoveIdForPokemon(pokemon, 3),
              getMoveIdForPokemon(pokemon, 4)
            ],
            hp: pokemon.stats.hp
          });
        }
        return team;
      }

      function renderMoveOptions(selectedId) {
        return moveCatalog.map((move) => `<option value="${move.id}" ${Number(move.id) === Number(selectedId) ? 'selected' : ''}>${move.name}</option>`).join('');
      }

      function renderItemOptions(selectedId) {
        return itemCatalog.map((item) => `<option value="${item.id}" ${Number(item.id) === Number(selectedId) ? 'selected' : ''}>${item.name}</option>`).join('');
      }

      function renderAbilityOptions(selectedId) {
        return abilityCatalog.map((ability) => `<option value="${ability.id}" ${Number(ability.id) === Number(selectedId) ? 'selected' : ''}>${ability.name}</option>`).join('');
      }

      function renderTeamBoard(teamKey) {
        const board = document.getElementById(`${teamKey}-team`);
        const team = state[teamKey];
        board.innerHTML = team.map((entry, index) => {
          const pokemon = getPokemonById(entry.pokemonId);
          return `
            <div class="team-card">
              <div class="card-head">
                <span class="card-badge">${index + 1}</span>
                <span class="card-name">${pokemon.name}</span>
              </div>

              <div>
                <label class="label">Pokémon</label>
                <select data-team="${teamKey}" data-slot="${index}" data-field="pokemon">
                  ${pokemonCatalog.map((option) => `<option value="${option.id}" ${option.id === Number(entry.pokemonId) ? 'selected' : ''}>${option.name}</option>`).join('')}
                </select>
              </div>

              <div class="config-row">
                <div>
                  <label class="label">Move 1</label>
                  <select data-team="${teamKey}" data-slot="${index}" data-move-index="0">${renderMoveOptions(entry.moveIds[0])}</select>
                </div>
                <div>
                  <label class="label">Move 2</label>
                  <select data-team="${teamKey}" data-slot="${index}" data-move-index="1">${renderMoveOptions(entry.moveIds[1])}</select>
                </div>
                <div>
                  <label class="label">Move 3</label>
                  <select data-team="${teamKey}" data-slot="${index}" data-move-index="2">${renderMoveOptions(entry.moveIds[2])}</select>
                </div>
                <div>
                  <label class="label">Move 4</label>
                  <select data-team="${teamKey}" data-slot="${index}" data-move-index="3">${renderMoveOptions(entry.moveIds[3])}</select>
                </div>
              </div>

              <div class="config-row">
                <div>
                  <label class="label">Item</label>
                  <select data-team="${teamKey}" data-slot="${index}" data-field="item">${renderItemOptions(entry.itemId)}</select>
                </div>
                <div>
                  <label class="label">Ability</label>
                  <select data-team="${teamKey}" data-slot="${index}" data-field="ability">${renderAbilityOptions(entry.abilityId)}</select>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderBattleStatus(text) {
        document.getElementById('battle-status').textContent = text;
      }

      function updateBattleScene(playerActive, botActive) {
        const playerName = document.getElementById('player-active-name');
        const botName = document.getElementById('bot-active-name');
        const playerSprite = document.getElementById('player-sprite');
        const botSprite = document.getElementById('bot-sprite');
        const playerHpText = document.getElementById('player-hp-text');
        const botHpText = document.getElementById('bot-hp-text');
        const playerHpBar = document.getElementById('player-hp-bar');
        const botHpBar = document.getElementById('bot-hp-bar');

        if (!playerActive || !botActive) {
          playerName.textContent = '-';
          botName.textContent = '-';
          playerSprite.textContent = '⚡';
          botSprite.textContent = '🌿';
          playerHpText.textContent = '0 / 0';
          botHpText.textContent = '0 / 0';
          playerHpBar.style.width = '0%';
          botHpBar.style.width = '0%';
          return;
        }

        playerName.textContent = playerActive.name;
        botName.textContent = botActive.name;
        playerSprite.textContent = playerActive.sprite;
        botSprite.textContent = botActive.sprite;

        playerHpText.textContent = `${playerActive.hp} / ${playerActive.maxHp}`;
        botHpText.textContent = `${botActive.hp} / ${botActive.maxHp}`;
        playerHpBar.style.width = `${Math.max(0, (playerActive.hp / playerActive.maxHp) * 100)}%`;
        botHpBar.style.width = `${Math.max(0, (botActive.hp / botActive.maxHp) * 100)}%`;
      }

      function renderMoveBar(activePokemon) {
        const moveBar = document.getElementById('move-bar');
        if (!activePokemon) {
          moveBar.innerHTML = '';
          return;
        }

        moveBar.innerHTML = activePokemon.moves.map((move) => `
          <button class="move-chip">
            <strong>${move.name}</strong>
            <span>${move.type} • ${move.power} power</span>
          </button>
        `).join('');
      }

      function appendLog(message) {
        const log = document.getElementById('battle-log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = message;
        log.prepend(entry);
      }

      function getAliveMembers(team) {
        return team.filter((member) => !member.fainted);
      }

      function getFrontliner(team) {
        const alive = getAliveMembers(team);
        if (!alive.length) return null;
        return alive.sort((a, b) => b.speed - a.speed)[0];
      }

      function getBattleMember(entry) {
        const pokemon = getPokemonById(entry.pokemonId);
        const item = getItemById(entry.itemId);
        const ability = getAbilityById(entry.abilityId);
        const totalHp = pokemon.stats.hp + item.bonus + ability.boost;
        return {
          ...entry,
          name: pokemon.name,
          sprite: pokemon.sprite,
          types: pokemon.types,
          hp: totalHp,
          maxHp: totalHp,
          attack: pokemon.stats.attack + item.bonus + ability.boost,
          defense: pokemon.stats.defense + Math.floor(item.bonus / 2),
          specialAttack: pokemon.stats.specialAttack + item.bonus + ability.boost,
          specialDefense: pokemon.stats.specialDefense + Math.floor(item.bonus / 2),
          speed: pokemon.stats.speed + Math.floor(ability.boost / 2),
          item,
          ability,
          moves: entry.moveIds.map((moveId) => getMoveById(moveId)),
          fainted: false
        };
      }

      function calculateTypeMultiplier(moveType, targetTypes) {
        let multiplier = 1;
        for (const targetType of targetTypes) {
          const chart = TYPE_CHART[moveType] || {};
          multiplier *= chart[targetType] || 1;
        }
        return multiplier;
      }

      function chooseBestMove(attacker, defender) {
        let best = attacker.moves[0];
        let bestScore = -Infinity;
        for (const move of attacker.moves) {
          const typeMultiplier = calculateTypeMultiplier(move.type, defender.types);
          const statBias = move.category === 'special' ? attacker.specialAttack : attacker.attack;
          const score = (move.power * typeMultiplier) + (move.priority * 20) + (statBias * 0.18);
          if (score > bestScore) {
            bestScore = score;
            best = move;
          }
        }
        return best;
      }

      function resolveAttack(attacker, defender, move, sourceLabel) {
        const typeMultiplier = calculateTypeMultiplier(move.type, defender.types);
        const crit = Math.random() < 0.12;
        const randomFactor = 0.85 + Math.random() * 0.3;
        const attackStat = move.category === 'special' ? attacker.specialAttack : attacker.attack;
        const defenseStat = move.category === 'special' ? defender.specialDefense : defender.defense;
        const baseDamage = ((2 * 100 / 5 + 2) * move.power * (attackStat / Math.max(1, defenseStat)) / 50 + 2);
        const rawDamage = baseDamage * typeMultiplier * randomFactor * (crit ? 1.6 : 1);
        const damage = Math.max(6, Math.round(rawDamage));

        defender.hp = Math.max(0, defender.hp - damage);
        defender.fainted = defender.hp <= 0;

        appendLog(`${sourceLabel} ${attacker.name} used <strong>${move.name}</strong> for ${damage} damage${crit ? ' (critical!)' : ''}.`);
        if (typeMultiplier > 1) appendLog('It was super effective!');
        if (typeMultiplier < 1 && typeMultiplier > 0) appendLog('It was not very effective...');
        if (typeMultiplier === 0) appendLog('It had no effect!');
        if (defender.hp <= 0) appendLog(`${defender.name} fainted!`);
      }

      function syncTeamEntry(teamKey, slotIndex, field, value) {
        const team = state[teamKey];
        if (!team[slotIndex]) return;

        if (field === 'pokemon') {
          const pokemon = getPokemonById(value);
          team[slotIndex].pokemonId = Number(value);
          team[slotIndex].moveIds = [
            getMoveIdForPokemon(pokemon, 1),
            getMoveIdForPokemon(pokemon, 2),
            getMoveIdForPokemon(pokemon, 3),
            getMoveIdForPokemon(pokemon, 4)
          ];
          team[slotIndex].abilityId = abilityCatalog[(pokemon.id * 13 + 5) % abilityCatalog.length].id;
          team[slotIndex].itemId = itemCatalog[(pokemon.id * 7 + 3) % itemCatalog.length].id;
        }

        if (field === 'item') team[slotIndex].itemId = Number(value);
        if (field === 'ability') team[slotIndex].abilityId = Number(value);
        if (field === 'move') team[slotIndex].moveIds[Number(value.index)] = Number(value.moveId);

        renderTeamBoard('player');
        renderTeamBoard('bot');
      }

      async function runBattle() {
        if (state.battleRunning) return;
        state.battleRunning = true;
        document.getElementById('battle-log').innerHTML = '';
        renderBattleStatus('Battle started! The arena is live.');

        const playerTeam = state.playerTeam.map(getBattleMember);
        const botTeam = state.botTeam.map(getBattleMember);

        let round = 1;
        while (true) {
          const playerActive = getFrontliner(playerTeam);
          const botActive = getFrontliner(botTeam);
          if (!playerActive || !botActive) break;

          const playerMove = chooseBestMove(playerActive, botActive);
          const botMove = chooseBestMove(botActive, playerActive);

          const actionOrder = [
            { side: 'player', actor: playerActive, move: playerMove, target: botActive },
            { side: 'bot', actor: botActive, move: botMove, target: playerActive }
          ].sort((a, b) => b.actor.speed - a.actor.speed);

          for (const action of actionOrder) {
            if (action.actor.fainted || action.target.fainted) continue;
            resolveAttack(action.actor, action.target, action.move, action.side === 'player' ? 'Player' : 'Bot');
            updateBattleScene(getFrontliner(playerTeam), getFrontliner(botTeam));
            renderMoveBar(getFrontliner(playerTeam));
            renderBattleStatus(`Round ${round}: ${getFrontliner(playerTeam)?.name || '—'} vs ${getFrontliner(botTeam)?.name || '—'}`);
            await new Promise((resolve) => setTimeout(resolve, 700));

            if (action.target.fainted) {
              const replacement = getFrontliner(action.side === 'player' ? playerTeam : botTeam);
              if (replacement && replacement !== action.target) {
                appendLog(`${action.side === 'player' ? 'Player' : 'Bot'} sends out <strong>${replacement.name}</strong>!`);
              }
            }
          }

          round += 1;
          if (getAliveMembers(playerTeam).length === 0 || getAliveMembers(botTeam).length === 0) break;
        }

        const remainingPlayer = getAliveMembers(playerTeam).length;
        const remainingBot = getAliveMembers(botTeam).length;

        if (remainingPlayer > remainingBot) {
          renderBattleStatus('Victory! You outlasted the bot team.');
          appendLog(`<strong>Final result:</strong> Player wins with ${remainingPlayer} Pokémon remaining.`);
        } else if (remainingBot > remainingPlayer) {
          renderBattleStatus('Defeat. The bot team took the win.');
          appendLog(`<strong>Final result:</strong> Bot wins with ${remainingBot} Pokémon remaining.`);
        } else {
          renderBattleStatus('Draw! Both teams held their ground.');
          appendLog('<strong>Final result:</strong> Draw game.');
        }

        updateBattleScene(getFrontliner(playerTeam), getFrontliner(botTeam));
        state.battleRunning = false;
      }

      function randomizePlayer() {
        state.playerTeam = getRandomTeam('player');
        renderTeamBoard('player');
        renderBattleStatus('Player roster refreshed.');
      }

      function randomizeBot() {
        state.botTeam = getRandomTeam('bot');
        renderTeamBoard('bot');
        renderBattleStatus('Bot roster refreshed.');
      }

      function savePreset(teamKey) {
        const key = `pokebattle:${teamKey}:preset`;
        localStorage.setItem(key, JSON.stringify(state[teamKey]));
        renderBattleStatus(`${teamKey === 'player' ? 'Player' : 'Bot'} preset saved.`);
      }

      function loadPreset(teamKey) {
        const key = `pokebattle:${teamKey}:preset`;
        const raw = localStorage.getItem(key);
        if (!raw) {
          renderBattleStatus('No saved preset found.');
          return;
        }
        state[teamKey] = JSON.parse(raw);
        renderTeamBoard(teamKey);
        renderBattleStatus(`${teamKey === 'player' ? 'Player' : 'Bot'} preset loaded.`);
      }

      function initState() {
        state.playerTeam = getRandomTeam('player');
        state.botTeam = getRandomTeam('bot');
        renderTeamBoard('player');
        renderTeamBoard('bot');
        updateBattleScene(null, null);
      }

      document.addEventListener('change', (event) => {
        const target = event.target;
        if (!target.matches('select')) return;

        const teamKey = target.dataset.team;
        const slotIndex = Number(target.dataset.slot);

        if (target.dataset.field === 'pokemon') {
          syncTeamEntry(teamKey, slotIndex, 'pokemon', Number(target.value));
          return;
        }
        if (target.dataset.field === 'item') {
          syncTeamEntry(teamKey, slotIndex, 'item', Number(target.value));
          return;
        }
        if (target.dataset.field === 'ability') {
          syncTeamEntry(teamKey, slotIndex, 'ability', Number(target.value));
          return;
        }
        if (target.dataset.moveIndex !== undefined) {
          syncTeamEntry(teamKey, slotIndex, 'move', {
            index: Number(target.dataset.moveIndex),
            moveId: Number(target.value)
          });
        }
      });

      document.getElementById('randomize-player').addEventListener('click', randomizePlayer);
      document.getElementById('randomize-bot').addEventListener('click', randomizeBot);
      document.getElementById('battle-btn').addEventListener('click', runBattle);
      document.getElementById('save-player').addEventListener('click', () => savePreset('player'));
      document.getElementById('load-player').addEventListener('click', () => loadPreset('player'));

      initState();
      renderBattleStatus('Pick your six and challenge the bot team.');
      appendLog('<strong>System:</strong> The Pokédex builder is ready. Build your squad and battle!');
      appendLog('<strong>Tip:</strong> Save your favorite six before starting a match.');
    </script>
  </body>
</html>
